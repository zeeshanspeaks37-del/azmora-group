<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E0A3" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#8C6D2D" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F5E0A3" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Geometric Luxury Emblem: Stylized Multi-Dimensional "A" & Global Node -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield / Compass Node -->
    <polygon points="50,5 95,95 5,95" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.3" />
    <!-- Dynamic A-Apex Left Wing -->
    <path d="M50,12 L18,88 L32,88 L50,42 L68,88 L82,88 Z" fill="url(#goldGrad)" filter="url(#subtleGlow)" />
    <!-- Central Cross Horizon & Forward Arrow -->
    <polygon points="34,62 66,62 63,54 37,54" fill="#FFFFFF" opacity="0.9" />
    <circle cx="50" cy="58" r="3.5" fill="#C5A059" />
  </g>

  <!-- Typography: AZMORA GROUP -->
  <g transform="translate(125, 68)">
    <text font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="40" font-weight="800" letter-spacing="4" fill="#FFFFFF">
      AZMORA
    </text>
    <text x="3" y="28" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="10" fill="url(#goldGrad)">
      GROUP
    </text>
  </g>
</svg>
